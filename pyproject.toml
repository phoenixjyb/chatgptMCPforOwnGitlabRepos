[project]
name = "chatgpt-selfhosted-gitlab-mcp"
version = "0.2.0a4"
description = "Read-only ChatGPT MCP plus CodingAgent, an agent-neutral GitLab coding workspace controller"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=2,<3",
  "httpx>=0.27,<1",
]

[project.scripts]
gitlab-agent = "gitlab_agent.cli:main"
codingagent = "gitlab_agent.codingagent_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitlab_agent"]
