[project]
name = "chatgpt-selfhosted-gitlab-mcp"
version = "0.2.0a1"
description = "Read-only ChatGPT MCP plus a local Codex-friendly GitLab worktree/coding engine"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=2,<3",
  "httpx>=0.27,<1",
]

[project.scripts]
gitlab-agent = "gitlab_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitlab_agent"]
